name: TICS Client and QServer

on: [pull_request]

jobs:
  TICS:
    name: TICS
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # Install system dependencies required to render Tkinter windows headlessly
    - name: Install Linux Graphical System dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    # Install your Python metrics utilities
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install coverage pyyaml pylint flake8

    # Wrap the test execution inside an xvfb virtual background display pipeline
    - name: Run unit tests with virtual display environment
      run: |
        xvfb-run --auto-servernum python -m coverage run -m unittest test_tics_dock.py

    - name: Generate XML coverage report
      run: |
        python -m coverage xml
    
    - name: Code quality analysis
      uses: tiobe/tics-github-action@37849-add_resultdir
      with:
        project: tics_dock
        viewerUrl: 'https://testlab.tiobe.com/tiobeweb/releasetest/api/cfg?name=releasetest'
        ticsAuthToken: ${{ secrets.RELEASETESTTOKEN }}
        resultdir: .
        installTics: true
